services:
  laravel:
    environment:
      - DB_PROTECT_DESTRUCTIVE_COMMANDS=true
      - DB_BACKUP_ENABLED=true
      - DB_BACKUP_KEEP_DAYS=${DB_BACKUP_KEEP_DAYS:-14}

  scheduler:
    container_name: laravel-scheduler
    command: php artisan schedule:work
    expose: []
    environment:
      - DB_PROTECT_DESTRUCTIVE_COMMANDS=true
      - DB_BACKUP_ENABLED=true
      - DB_BACKUP_KEEP_DAYS=${DB_BACKUP_KEEP_DAYS:-14}
    restart: unless-stopped

  mysql:
    volumes:
      - ./docker/mysql/conf.d/pik5.cnf:/etc/mysql/conf.d/pik5.cnf:ro

  next:
    command: sh -c "yarn build && exec yarn start"
    stdin_open: false
    tty: false
    restart: unless-stopped
