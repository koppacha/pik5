
services:
  laravel:
    build:
      context: .
      dockerfile: ./laravel/Dockerfile
      args:
        - TZ=${TZ}
    container_name: laravel
    volumes:
      - ./laravel:/var/www/laravel
      - ./project.json:/var/www/project.json:ro
      - ./backups/mysql:/var/backups/mysql
    expose:
      - "8000"
    restart:
      always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '100'
    environment:
      - FRONTEND_URL=next
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - TZ=${TZ}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - DB_PROTECT_DESTRUCTIVE_COMMANDS=${DB_PROTECT_DESTRUCTIVE_COMMANDS:-false}
      - DB_BACKUP_ENABLED=${DB_BACKUP_ENABLED:-false}
      - DB_BACKUP_KEEP_DAYS=${DB_BACKUP_KEEP_DAYS:-14}
      - DB_BACKUP_TIME=${DB_BACKUP_TIME:-03:20}

  mysql:
    container_name: mysql
    image: mysql:8.0
    init: true
    platform: ${PLATFORM}
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - TZ=${TZ}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    user: root:root
    ports:
      - ${DB_PORT}:3306
    volumes:
      - ./mysql:/var/lib/mysql
      - ./log/mysql:/var/log
      - ./docker/mysql/conf.d/pik5.cnf:/etc/mysql/conf.d/pik5.cnf:ro
    restart:
      always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '100'

  redis:
    container_name: redis
    image: redis:latest
    init: true
    volumes:
      - ./redis:/data

  next:
    build:
      context: .
      dockerfile: ./next/Dockerfile
      args:
        - TZ=${TZ}
    container_name: next
    working_dir: /var/www/next
    stdin_open: true
    command: sh -c "sleep infinity"
    tty: true
    volumes:
      - ./next:/var/www/next
      - ./project.json:/var/www/project.json:ro
    ports:
      - "3005:3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '100'
